<!DOCTYPE html>
<html>
    <body>
        <!--Στον ακόλουθο κώδικα προσθέστε μια ιδιότητα onclick στο κουμπί ώστε να καλείται η συνάρτηση myFunction όταν το πατάμε-->
        <button onclick="myFunction()">Click Me</button>
        <p id="demo"></p>
        <script>
           function myFunction() {
             document.getElementById("demo").innerHTML = "Hello World";
            }
        </script>
    </body>
</html>
