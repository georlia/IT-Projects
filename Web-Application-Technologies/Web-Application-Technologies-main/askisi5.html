<!DOCTYPE html>
<html>
    <!-- Θεμα 1ο  -->
<body>
    <form action="insert_item" method="post">     <!--Στέλνει απαίτηση σε servlet, Μέθοδος post για την υποβολή-->
        Περίγραφη: <input type="text"  name="description"> <!--Φόρμα 3 πεδίων περιγραφή,εύρων,τοποθεσία-->
        Ευρών: <input type="text" name="finder">
        Τοποθεσία: <input type="text" name="location">       
        <input type="submit" value="Υποβολη">     <!--Κουμπί υποβολής φόρμας-->
    </form>
</body>
</html>

<!--Δώστε τον HTML κώδικα για να δημιουργήσετε μια φόρμα που θα συλλέγει τις πληροφορίες ενός αντικειμένου και θα τις εισάγει στον πίνακα. 
Η φόρμα θα πρέπει να υποστηρίζει τις εξής λειτουργίες:
α) Θα χρησιμοποιεί μέθοδο post για την υποβολή.
β) Θα στέλνει την απαίτηση σε μια μικροϋπηρεσία (servlet) με το όνομα url insert_item.
γ) Θα περιέχει τρία πεδία κειμένου στα οποία ο χρήστης θα εισάγει την περιγραφή, τον ευρόντα και την τοποθεσία που ανευρέθηκε το αντικείμενο. 
Η φόρμα θα χρησιμοποιεί τα ονόματα: description, finder και location για την αποστολή των πληροφοριών στην μικροϋπηρεσία.
δ) Θα περιέχει ένα κουμπί για την υποβολή της φόρμας.-->
