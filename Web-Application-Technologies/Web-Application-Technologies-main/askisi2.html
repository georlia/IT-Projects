<!DOCTYPE html>
<html>
<head>
    <!--Δημιουργήστε ένα αρχείο JavaScript με όνομα askisi2.js το οποίο να τοποθετεί στο συστατικό <h2> του προηγούμενου εγγράφου 
    το κείμενο ”Hello from Javascript” και να εμφανίζει το κείμενο της επικεφαλίδας <h1> με πράσινο χρώμα σε κίτρινο φόντο.-->
    <!--Κάθε συστατικό του Javascript DOM περιέχει μια ιδιότητα textContent για προσπέλαση του κειμένου του και μια ιδιότητα className 
    για προσπέλαση της κλάσης τοu(attribute class).Παρατηρείστε ότι υπάρχει και ένας κανόνας CSS που μπορείτε να χρησιμοποιήσετε. -->
    <meta charset="utf-8"/>
    <style>
       .green {color : green ;background-color : yellow;}
    </style>
</head>
<body>
    <h1> Το ακόλουθο κείμενο παράγεται με JavaScript </h1>
    <h2 id="hello">Δεν δουλεύει σωστά η JavaScript!!!</h2>
    <script src="askisi2.js"></script>
</body>
</html>
