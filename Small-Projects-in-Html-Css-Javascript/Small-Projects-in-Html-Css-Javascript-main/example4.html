<!DOCTYPE html>
<html>
    <head>
        <style>
        .dotted {text-decoration: underline dotted #2A9D8F;}

        .wavy {text-decoration: wavy underline #62767E;}

        .capitalize{text-transform: capitalize;}

        .uppercase{text-transform: uppercase;}

        .lowercase{text-transform: lowercase;}
 
        h1{ text-shadow: 6px -4px 4px blue;}/*orizontia katheta blur xroma */
        
        h3 {
            text-decoration-line: underline;
            text-decoration-style: dashed;
            text-decoration-color: red;}

        #font-georgia{font-family: Georgia;}

        a{
            color:chocolate;
            font-family:'Arial',serif;
        }
        </style>
    </head>

    <body>
        <div class="container">
            
            <p class="dotted">This is a dotted underline.</p>
              
            <p class="wavy">This is a wavy underline.</p>
            
            <p class="capitalize">This is a sentence with capitalize transformation.</p>

            <p class="uppercase">This is a sentence with uppercase transformation.</p>

            <p class="lowercase">THIS IS A SENTENCE WITH LOWERCASE TRANSFORMATION.</p>
        
            <h1>Hello world</h1>
            <h3>Georlia </h3>

            <p id="font-georgia">Georgia font</p>
            <p>Check out our:
                <a href="https://www.example.com">special offers</a>
                page for amazing deals.</p>
        </div>
        
    </body>
</html>
