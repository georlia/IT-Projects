<!DOCTYPE html>
<html>
<head>
    <style>
        /* defines the style unvisited links */
        a:link {color: #D11BCE;text-decoration: none;}

        /* a link is hovered when the mouse is over it */
        a:hover {color: #6897EE; background-color: #000000;}

        /* click on the link but hasn't released the mouse button yet */
        a:active {color: #B8860B; background-color: #000000;}

        input[type="text"], 
        input[type="email"] {
           border: 1px solid #FF9E03;
           background-color: #17233B;
           color: #FFFFFF;
           font-weight: bold;}

        label {
            font-weight: bold;
            color: #FF9E03;}
        body{
            background-image: url('https://cdn.britannica.com/34/235834-050-C5843610/two-different-breeds-of-cats-side-by-side-outdoors-in-the-garden.jpg');
            height: 200px;
            width: 100px;
        } 
        #box{
            width: 100px;
            height: 100px;
            background-color: #D11BCE;
            transition:width 1s, height 1s, background-color 1s;
        }
        #box:active{
            width: 150px;
            height: 150px;
            background-color: #FF9E03;
        }
        button{
            padding: 10px 20px;
            font-size: 16px;
            margin: 30px;
            border: none;
            border-radius: 5px;
            background-color: aqua;
            color:#000000;
            transition: transform 1s;
        }
        button:active {
            transform: scale(1.3);
        }

    </style>
    </head>
    <body>

       <a href="www.example.com">Link</a>
     <form>
         <label for="name">Name: </label>
         <input type="text" id="name">
         <br><br>
         <label for="email">Email: </label>
         <input type="email" id="email">
         <br><br>
         <input type="button" value="Send">
      </form>
      <div id="box">Press and hold</div>
      <button>Press & Hold</button>
    </body>
</html>
